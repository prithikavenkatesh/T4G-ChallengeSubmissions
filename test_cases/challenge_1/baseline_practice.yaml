case_id: baseline_practice
difficulty: baseline
category: challenge_1
count_check: ground_truth
practice: true
source: "EuroChef+ Customer Support Messages Dataset (BenTouss/eurochef-cs on Hugging Face) — real labeled data"

tickets:
  - id: P1
    text: "I need help ASAP! I'm hosting a cooking night and none of the videos will load on my iPad, even though I have good WiFi."
  - id: P2
    text: "Does the free tier include access to the unit converter tool? I can't seem to find it on the interface."
  - id: P3
    text: "Hi, I'd love to see a masterclass on traditional British pies using hot water crust pastry. Maybe something from a chef in Yorkshire?"
  - id: P4
    text: "I was charged €9.99 even though I cancelled during the trial period. I cancelled on 05 Jan, charge shows on 06 Jan. Please refund and confirm my subscription is closed."
  - id: P5
    text: "I represent a culinary college in Dublin. We are interested in purchasing bulk licenses for our 200 students for the upcoming semester."

constraints_shown_to_student:
  - "Classify each ticket as Urgent or Routine based on its content"
  - "Do not list tickets individually"
  - "Output only one line: 'X of 5 tickets are urgent.' where X is the number you classified as Urgent"

ground_truth:
  urgent_ids: ["P1", "P4"]
  urgent_count: 2

grading_weights:
  format_compliance: 0.3
  count_correct: 0.7

trials: 3
