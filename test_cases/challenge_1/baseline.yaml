case_id: baseline
difficulty: baseline
category: challenge_1
count_check: ground_truth
source: "EuroChef+ Customer Support Messages Dataset (BenTouss/eurochef-cs on Hugging Face) — real labeled data"

tickets:
  - id: T1
    text: "ABSOLUTELY RIDICULOUS SERVICE. The live stream for the Christmas special is down completely. Error 503. My whole family is waiting!!!"
  - id: T2
    text: "Could you add a filter for lactose-free recipes? The \"dietary restrictions\" search has gluten-free and vegan, but nothing for lactose intolerance. Not urgent, just a suggestion."
  - id: T3
    text: "Could you add an option for users to comment on recipes or share tips? It would enhance community interaction."
  - id: T4
    text: "I was charged for a full year subscription yesterday but I selected monthly! This is a mistake, please refund me the difference ASAP."
  - id: T5
    text: "I think the app layout for smartphones could be improved. It's a bit cluttered at the moment, especially when browsing recipes."

constraints_shown_to_student:
  - "Classify each ticket as Urgent or Routine based on its content"
  - "Do not list tickets individually"
  - "Output only one line: 'X of 5 tickets are urgent.' where X is the number you classified as Urgent"

ground_truth:
  urgent_ids: ["T1", "T4"]
  urgent_count: 2

grading_weights:
  format_compliance: 0.3
  count_correct: 0.7

trials: 3
