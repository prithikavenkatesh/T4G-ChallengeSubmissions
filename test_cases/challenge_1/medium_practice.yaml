case_id: medium_practice
difficulty: medium
category: challenge_1
count_check: ground_truth
practice: true
source: "EuroChef+ Customer Support Messages Dataset (BenTouss/eurochef-cs on Hugging Face) — real labeled data"

tickets:
  - id: P1
    text: "Hi, I'm trying to watch the live cooking session but it keeps buffering every few seconds. My internet connection is strong (100mbps). Please help, I'm cooking along!"
  - id: P2
    text: "I keep receiving emails about new features, but when I log in, I don't see anything new. Is there a delay for certain users?"
  - id: P3
    text: "Hi, I'm unable to access any live streams on weekends despite being a Premium member. Can you look into this?"
  - id: P4
    text: "My video keeps buffering at exactly 12:04 in the Chocolate Soufflé video. I've tried clearing cache and different browsers. It's definitely the video file."
  - id: P5
    text: "I'm trying to upgrade to Premium to watch the Beef Wellington masterclass, but my card keeps getting declined. I've tried two different cards. Is your payment system down?"
  - id: P6
    text: "I'm having trouble with the automatic unit conversion. It keeps showing oz instead of grams despite my settings. Can you help?"

constraints_shown_to_student:
  - "Classify each ticket as Urgent or Routine based on its content"
  - "For Urgent tickets only, output: ticket ID and a one-sentence issue summary (under 20 words)"
  - "Routine tickets are not shown individually — only counted"
  - "End the report with: 'X of 6 tickets required urgent action.' where X must match the number of tickets you listed as Urgent above"
  - "Output as a markdown bulleted list, followed by the count line"

ground_truth:
  urgent_ids_definite: ["P1", "P5"]
  urgent_ids_borderline: ["P3"]
  urgent_count_accepted: [2, 3]

grading_weights:
  classification_accuracy: 0.30
  format_compliance: 0.30
  count_matches_ground_truth: 0.40

trials: 3
