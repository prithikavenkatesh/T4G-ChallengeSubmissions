case_id: hard
difficulty: hard
category: challenge_1
count_check: self_consistency
source: "EuroChef+ Customer Support Messages Dataset (BenTouss/eurochef-cs on Hugging Face) — real labeled data"

tickets:
  - id: T1
    text: "My downloads disappeared overnight. I'm Premium and had 8 videos saved (incl. \"Paris-Brest Masterclass\") for offline use. Now the Offline tab is empty and re-downloading says \"Storage permission required\" even though it's enabled (Android 14)."
  - id: T2
    text: "My daughter deleted my profile by mistake. Is there any way to restore my favorites list? I had saved over 100 recipes."
  - id: T3
    text: "I've been experiencing poor video quality for the past few days even though I'm connected to high-speed internet. Please address this issue quickly."
  - id: T4
    text: "The shopping list export feature missed half the ingredients for the Risotto recipe. I had to go back to the store!"
  - id: T5
    text: "Hi, I'm trying to upgrade to the annual plan to save money, but the checkout page keeps spinning and won't process my card. I've tried two different cards."
  - id: T6
    text: "Hi, I'm quite disappointed as the 'Cordon Bleu' recipe video cuts off at the end. It's missing the final plating instructions, which are crucial!"
  - id: T7
    text: "Hi there, I noticed that the nutritional information is missing for the entire Vegan Desserts section. As a diabetic, I need to know the sugar content before I cook."
  - id: T8
    text: "I'm locked out of my account. It says 'too many login attempts' but I only tried once. I need to access my saved recipes for a dinner party tonight!"

constraints_shown_to_student:
  - "Classify each ticket as Urgent or Routine based on its content"
  - "For Urgent tickets only, output: ticket ID, one-sentence issue summary (under 20 words), and a suggested next action"
  - "Routine tickets are not shown individually — only counted"
  - "End the report with: 'X of 8 tickets required urgent action.' where X must exactly match the number of tickets you classified as Urgent above"
  - "Output as markdown: a bulleted list for Urgent tickets, followed by the summary line"

ground_truth:
  urgent_ids_definite: ["T1", "T5", "T8"]
  urgent_ids_ambiguous: ["T3", "T6"]

grading_weights:
  classification_accuracy: 0.25
  format_compliance: 0.25
  count_present_and_parseable: 0.15
  count_matches_own_list: 0.35

trials: 3
