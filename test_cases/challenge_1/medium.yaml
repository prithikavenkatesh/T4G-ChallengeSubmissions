case_id: medium
difficulty: medium
category: challenge_1
count_check: ground_truth
source: "EuroChef+ Customer Support Messages Dataset (BenTouss/eurochef-cs on Hugging Face) — real labeled data"

tickets:
  - id: T1
    text: "The unit conversion tool is broken. When I switch from Celsius to Fahrenheit, it says bake at 350°C which would burn everything!"
  - id: T2
    text: "I love the masterclasses but sometimes the audio doesn't sync with the video. It's not every time, but it's annoying when it happens."
  - id: T3
    text: "Hi, my kid accidentally deleted my entire playlist. Is there a way to recover it? It took me months to curate!"
  - id: T4
    text: "The 'Step-by-step' mode is buggy on my Samsung TV. It pauses but then skips the next 5 seconds when I resume."
  - id: T5
    text: "My Premium account shows 'Playback not allowed in your region' when I'm in Belgium (Brussels). I'm literally at home on Proximus Wi-Fi. Error: GEO-03. Started today. Please help."
  - id: T6
    text: "Your \"unit conversion\" is wrong in the 'Stamppot' recipe: it converts 1 kg potatoes to 1 lb instead of 2.2 lb. That's a pretty big mistake. Can you fix the converter?"

constraints_shown_to_student:
  - "Classify each ticket as Urgent or Routine based on its content"
  - "For Urgent tickets only, output: ticket ID and a one-sentence issue summary (under 20 words)"
  - "Routine tickets are not shown individually — only counted"
  - "End the report with: 'X of 6 tickets required urgent action.' where X must match the number of tickets you listed as Urgent above"
  - "Output as a markdown bulleted list, followed by the count line"

ground_truth:
  urgent_ids_definite: ["T1", "T5"]
  urgent_ids_borderline: ["T3"]
  urgent_count_accepted: [2, 3]

grading_weights:
  classification_accuracy: 0.30
  format_compliance: 0.30
  count_matches_ground_truth: 0.40

trials: 3
